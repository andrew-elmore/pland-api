name: Deploy API to Cloud Run

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push
        run: |
          gcloud auth configure-docker
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/pland-api .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/pland-api

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy pland-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/pland-api \
            --platform managed \
            --region us-central1 \
            --port 8080 \
            --allow-unauthenticated \
            --update-env-vars "^::^MONGODB_URI=${{ secrets.PROD_MONGODB_URI }}::JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}::GOOGLE_MAPS_API_KEY=${{ secrets.PROD_GOOGLE_MAPS_API_KEY }}"
