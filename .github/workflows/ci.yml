name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm

      - run: npm ci

      - name: Test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/pland-authorization-test
        run: npm test
